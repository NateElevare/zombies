# HTTP bootstrap; replace the placeholder domain, then run:
# sudo certbot --nginx --redirect -d deadzone.example.com
# Do not overwrite Certbot's updated configuration with this file afterward.
server {
    listen 80;
    listen [::]:80;
    server_name deadzone.example.com;

    client_max_body_size 4m;
    client_body_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
